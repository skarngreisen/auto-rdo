<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDO Auto — Admin</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }
header { background: #1e3a5f; color: #fff; padding: .6rem 1rem; display: flex; align-items: center; gap: .8rem; position: sticky; top: 0; z-index: 100; }
header h1 { font-size: 1rem; }
header nav { display: flex; gap: .3rem; }
header nav button { background: rgba(255,255,255,.12); color: #fff; border: none; padding: .4rem .9rem; border-radius: 6px; cursor: pointer; font-size: .82rem; font-weight: 600; }
header nav button.active { background: #fff; color: #1e3a5f; }

.container { max-width: 900px; margin: 0 auto; padding: 1rem; }
.card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); padding: 1rem; margin-bottom: .75rem; }
.card-header { font-size: .85rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #1e3a5f; margin-bottom: .75rem; padding-bottom: .5rem; border-bottom: 2px solid #e8ecf1; }

table { width: 100%; border-collapse: collapse; font-size: .82rem; }
th { background: #f3f4f6; color: #374151; font-weight: 600; padding: .5rem .4rem; text-align: left; font-size: .75rem; text-transform: uppercase; letter-spacing: .03em; }
td { padding: .45rem .4rem; border-bottom: 1px solid #f3f4f6; }
tr:hover { background: #f8fafc; }

input, select, textarea {
  padding: .45rem .55rem; font-size: .85rem; border: 1.5px solid #d1d5db; border-radius: 6px;
  background: #fafbfc; font-family: inherit; width: 100%;
}
input:focus, select:focus { outline: none; border-color: #3b82f6; }
.row { display: flex; gap: .5rem; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 120px; }

.btn {
  display: inline-flex; align-items: center; gap: .3rem;
  padding: .45rem .85rem; font-size: .8rem; font-weight: 600;
  border: none; border-radius: 6px; cursor: pointer; font-family: inherit;
}
.btn-primary { background: #1e3a5f; color: #fff; }
.btn-danger { background: #fee2e2; color: #991b1b; }
.btn-secondary { background: #e8ecf1; color: #374151; }
.btn-sm { padding: .25rem .5rem; font-size: .72rem; }
.btn:disabled { opacity: .5; pointer-events: none; }
.actions { display: flex; gap: .3rem; }

.badge { font-size: .7rem; font-weight: 700; padding: .15rem .45rem; border-radius: 10px; text-transform: uppercase; white-space: nowrap; }
.badge-rascunho { background: #e5e7eb; color: #374151; }
.badge-em_revisao { background: #fef3c7; color: #92400e; }
.badge-aprovado { background: #d1fae5; color: #065f46; }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 12px; padding: 1.5rem; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; }
.modal h2 { font-size: 1.05rem; margin-bottom: 1rem; }
.modal label { display: block; font-size: .78rem; font-weight: 600; color: #374151; margin: .5rem 0 .2rem; }

.toast {
  position: fixed; bottom: 1rem; left: 1rem; right: 1rem; padding: .75rem 1rem;
  border-radius: 10px; font-size: .85rem; font-weight: 600; text-align: center;
  z-index: 300; max-width: 500px; margin: 0 auto;
  transform: translateY(120%); transition: transform .3s;
}
.toast.show { transform: translateY(0); }
.toast.success { background: #d1fae5; color: #065f46; }
.toast.error { background: #fee2e2; color: #991b1b; }

.tab { display: none; }
.tab.active { display: block; }

.ro-section { margin-bottom: .8rem; }
.ro-section h3 { font-size: .8rem; color: #1e3a5f; margin-bottom: .3rem; border-bottom: 1px solid #e8ecf1; padding-bottom: .2rem; }
.ro-row { display: flex; font-size: .78rem; padding: .1rem 0; }
.ro-label { color: #6b7280; width: 100px; flex-shrink: 0; }
.ro-value { color: #1a1a2e; font-weight: 600; }
@media (max-width: 480px) {
  .ops-table {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    white-space: nowrap;
    margin: 0 -1rem;
    width: calc(100% + 2rem);
  }
  .card { padding: .75rem; }
}
</style>
</head>
<body>

<header>
  <h1>RDO Auto — Admin</h1>
  <nav>
    <button class="active" data-tab="projetos">Projetos</button>
    <button data-tab="rdos">RDOs</button>
    <button data-tab="usuarios">Usuários</button>
  </nav>
  <div style="flex:1;"></div>
  <div style="position:relative;">
    <span id="headerUserName" style="font-size:.75rem;cursor:pointer;padding:.2rem .5rem;border-radius:4px;" onclick="toggleUserMenu()">&#9660;</span>
    <div id="userMenu" style="display:none;position:absolute;right:0;top:100%;background:#fff;color:#1a1a2e;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.15);padding:.3rem 0;min-width:140px;z-index:150;">
      <div style="padding:.3rem .8rem;font-size:.75rem;color:#6b7280;border-bottom:1px solid #e5e7eb;" id="userMenuPhone"></div>
      <button onclick="doLogout()" style="display:block;width:100%;text-align:left;padding:.4rem .8rem;font-size:.78rem;border:none;background:none;cursor:pointer;">Sair</button>
    </div>
  </div>
</header>

<div class="container">

  <!-- ============ TAB: PROJETOS ============ -->
  <div class="tab active" id="tabProjetos">
    <div class="card">
      <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
        Projetos
        <button class="btn btn-primary btn-sm" id="btnNewProject">+ Novo</button>
      </div>
      <table id="projetosTable">
        <tr><th>Projeto</th><th>Localidade</th><th>Sonda</th><th>Início</th><th>Turnos</th><th>Geólogo</th><th></th></tr>
      </table>
    </div>
  </div>

  <!-- ============ TAB: RDOs ============ -->
  <div class="tab" id="tabRdos">
    <div class="card">
      <div class="card-header">Filtros</div>
      <div class="row">
        <div><label>Projeto</label><select id="filtroProjeto"><option value="">Todos</option></select></div>
        <div><label>De</label><input type="date" id="filtroDe"></div>
        <div><label>Até</label><input type="date" id="filtroAté"></div>
        <div><label>Status</label><select id="filtroStatus"><option value="">Todos</option><option value="rascunho">Rascunho</option><option value="em_revisao">Em Revisão</option><option value="aprovado">Aprovado</option></select></div>
      </div>
      <div style="margin-top:.5rem;display:flex;gap:.5rem;align-items:center;">
        <button class="btn btn-primary btn-sm" id="btnFiltrar">Filtrar</button>
        <button class="btn btn-secondary btn-sm" id="btnExportCSV">Exportar CSV</button>
        <label style="margin:0;font-size:.78rem;"><input type="checkbox" id="filtroAllVersions" onchange="loadRDOs()"> Mostrar todas as versões</label>
      </div>
    </div>
    <div class="card">
      <div class="card-header">Resultados (<span id="rdosCount">0</span>)</div>
      <div style="overflow-x:auto;">
        <table id="rdosTable">
          <tr><th>Data</th><th>Projeto</th><th>Tipo</th><th>Prof. (m)</th><th>Status</th><th></th></tr>
        </table>
      </div>
    </div>
    <!-- RDO Detail (read-only) -->
    <div class="card" id="rdoDetail" style="display:none;">
      <div class="card-header" style="display:flex;justify-content:space-between;">
        <span>Detalhes do RDO</span>
        <button class="btn btn-secondary btn-sm" id="btnCloseDetail">Fechar</button>
      <button class="btn btn-primary btn-sm" id="btnPDFDetail" onclick="generatePDF(currentDetailId)" style="display:none;">Exportar PDF</button>
      <button class="btn btn-primary btn-sm" id="btnApprove" style="display:none;background:#10b981;">Aprovar</button>
      <button class="btn btn-secondary btn-sm" id="btnRevertToDraft" style="display:none;" onclick="revertToDraft(currentDetailId)">Reverter p/ Rascunho</button>
      </div>
      <div id="rdoDetailContent"></div>
    </div>
  </div>

  <!-- ============ TAB: USUARIOS ============ -->
  <div class="tab" id="tabUsuarios">
    <div class="card">
      <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
        Usuários
        <button class="btn btn-primary btn-sm" id="btnNewUser">+ Novo</button>
      </div>
      <table id="usuariosTable">
        <tr><th>Nome</th><th>Email</th><th>Celular</th><th>Função</th><th></th></tr>
      </table>
    </div>
  </div>

</div>

<!-- Modal: New/Edit User -->
<div class="modal-overlay" id="modalUser">
  <div class="modal">
    <h2 id="modalUserTitle">Novo Usuário</h2>
    <input type="hidden" id="editUserId">
    <label>Nome</label><input type="text" id="modalUserName">
    <label>Email</label><input type="email" id="modalUserEmail" placeholder="ex: nome@gel-eng.com.br">
    <label>Celular (com DDD)</label><input type="tel" id="modalUserPhone">
    <label>Nova senha</label><input type="password" id="modalUserPassword" placeholder="Min. 8 caracteres">
    <label>Confirmar senha</label><input type="password" id="modalUserPassword2" placeholder="Repita a senha">
    <label>Função</label><select id="modalUserRole">
      <option value="colaborador">Colaborador</option>
      <option value="supervisor">Supervisor</option>
      <option value="admin">Admin</option>
    </select>
    <div style="display:flex;gap:.5rem;margin-top:1rem;">
      <button class="btn btn-secondary" id="btnUserModalCancel" style="flex:1;">Cancelar</button>
      <button class="btn btn-primary" id="btnUserModalSave" style="flex:1;">Salvar</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal: New/Edit Project -->
<div class="modal-overlay" id="modalProject">
  <div class="modal" style="max-width:650px;">
    <h2 id="modalProjectTitle">Novo Projeto</h2>
    <input type="hidden" id="editProjectId">
    <label>Nome do projeto</label><input type="text" id="modalCliente">
    <label>Localidade</label><input type="text" id="modalLocalidade" placeholder="ex: Ribeirão Preto - SP">
    <label>Sonda</label><select id="modalSonda"><option value="">Selecionar sonda...</option><option value="Cardwell">Cardwell</option><option value="R4">R4</option><option value="A10">A10</option><option value="Tornep">Tornep</option></select>
    <div class="row">
      <div><label>Data Início</label><input type="date" id="modalDataInício"></div>
      <div><label>Turno (descrição)</label><input type="text" id="modalTurno" value="07h x 17h"></div>
    </div>
    <div class="row" style="margin-top:.5rem;">
      <div><label>Turnos por dia</label>
        <select id="modalTurnosPorDia" onchange="toggleSupervisor2()">
          <option value="1">1 turno (24h)</option>
          <option value="2">2 turnos (12h cada)</option>
        </select>
      </div>
    </div>
    <hr style="margin:1rem 0;border:none;border-top:2px solid #e8ecf1;">
    <div class="card-header">Geologo Responsavel</div>
    <div id="geologoHistory" style="font-size:.75rem;color:#6b7280;margin-bottom:.5rem;"></div>
    <select id="modalGeologo" style="margin-bottom:.5rem;"><option value="">Selecionar geólogo...</option></select>
    <div class="card-header" style="margin-top:.75rem;">Supervisores de Turno</div>
    <div id="supervisorHistory" style="font-size:.75rem;color:#6b7280;margin-bottom:.5rem;"></div>
    <div class="row" id="supervisorFields">
      <div><label>Turno 1 (nome)</label><input type="text" id="modalSupervisor1" placeholder="Nome do supervisor"></div>
      <div id="supervisor2Group" style="display:none;"><label>Turno 2 (nome)</label><input type="text" id="modalSupervisor2" placeholder="Nome do supervisor"></div>
    </div>
    <div style="display:flex;gap:.5rem;margin-top:1rem;">
      <button class="btn btn-secondary" id="btnModalCancel" style="flex:1;">Cancelar</button>
      <button class="btn btn-primary" id="btnModalSave" style="flex:1;">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: Confirm Delete -->
<div class="modal-overlay" id="modalConfirm">
  <div class="modal" style="text-align:center;">
    <h2 id="confirmTitle">Confirmar</h2>
    <p id="confirmMsg" style="margin:.8rem 0;font-size:.9rem;"></p>
    <div style="display:flex;gap:.5rem;">
      <button class="btn btn-secondary" id="btnConfirmCancel" style="flex:1;">Cancelar</button>
      <button class="btn btn-danger" id="btnConfirmOk" style="flex:1;">Sim, excluir</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient(
  "https://fecskilrtsaeavoznwgi.supabase.co",
  "sb_publishable_VjwnlFeGz7zJkZx_KPxukA_GCTRxcgi"
);
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// ── Auth guard (admin/geólogo only) ──
let currentUser = null, currentProfile = null;
(async function adminAuth() {
  const { data } = await sb.auth.getSession();
  if (!data?.session?.user) {
    window.location.href = "index.html";
    return;
  }
  currentUser = data.session.user;
  const { data: profile } = await sb.from("profiles").select("*").eq("user_id", currentUser.id).maybeSingle();
  if (!profile || (profile.role !== "admin" && profile.role !== "supervisor")) {
    window.location.href = "index.html";
    return;
  }
  currentProfile = profile;
  $("#headerUserName").textContent = profile.name || profile.phone || currentUser.email;
  $("#userMenuPhone").textContent = profile.phone || "-";
})();

function toggleUserMenu() {
  const menu = $("#userMenu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}
document.addEventListener("click", (e) => {
  if (!e.target.closest("#userMenu") && e.target.id !== "headerUserName") {
    $("#userMenu").style.display = "none";
  }
});

async function doLogout() {
  await sb.auth.signOut();
  window.location.href = "index.html";
}

let toastTimer;
function toast(msg, type) {
  const t = $("#toast");
  t.textContent = msg; t.className = "toast " + type + " show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "toast", 3000);
}

// ============================================================
// TAB NAVIGATION
// ============================================================
$$("header nav button").forEach(btn => {
  btn.addEventListener("click", () => {
    $$("header nav button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    $$(".tab").forEach(t => t.classList.remove("active"));
    $("#tab" + btn.dataset.tab.charAt(0).toUpperCase() + btn.dataset.tab.slice(1)).classList.add("active");
    if (btn.dataset.tab === "projetos") loadProjetos();
    else if (btn.dataset.tab === "rdos") { loadRDOFilters(); loadRDOs(); }
    else if (btn.dataset.tab === "usuarios") loadUsuários();
  });
});

// ============================================================
// PROJECTS
// ============================================================
async function loadProjetos() {
  const { data } = await sb.from("projetos").select("*").order("created_at", { ascending: false });
  const tbody = $("#projetosTable");
  if (!data || data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:1rem;color:#9ca3af;">Nenhum projeto.</td></tr>';
    return;
  }
  // Fetch current geologists for all projects in one query
  const projetoIds = data.map(p => p.id);
  const geoMap = {};
  try {
    const { data: geologos } = await sb.from("projeto_geologos")
      .select("projeto_id, profiles!inner(name)")
      .in("projeto_id", projetoIds)
      .is("fim", null);
    if (geologos) geologos.forEach(g => { geoMap[g.projeto_id] = g.profiles.name; });
  } catch (e) {
    console.warn("projeto_geologos table not found — run migration-notifications.sql first");
  }

  tbody.innerHTML = data.map(p => `
    <tr>
      <td>${p.cliente}</td><td>${p.localidade}</td><td>${p.sonda}</td>
      <td>${p.data_inicio}</td>
      <td><span class="badge" style="background:#e8ecf1;color:#374151;">${p.turnos_por_dia || 1}t</span></td>
      <td style="font-size:.78rem;">${geoMap[p.id] || '-'}</td>
      <td class="actions">
        <button class="btn btn-secondary btn-sm" onclick="editProject('${p.id}')">Editar</button>
        <button class="btn btn-danger btn-sm" onclick="confirmDeleteProject('${p.id}','${p.cliente}')">Excluir</button>
      </td>
    </tr>`).join("");
}

$("#btnNewProject").addEventListener("click", () => {
  $("#modalProjectTitle").textContent = "Novo Projeto";
  $("#editProjectId").value = "";
  $("#modalCliente").value = ""; $("#modalLocalidade").value = "";
  $("#modalSonda").value = ""; $("#modalDataInício").value = new Date().toISOString().split("T")[0];
  $("#modalTurno").value = "07h x 17h";
  $("#modalTurnosPorDia").value = "1";
  $("#modalGeologo").value = "";
  $("#modalSupervisor1").value = "";
  $("#modalSupervisor2").value = "";
  $("#geologoHistory").innerHTML = "";
  $("#supervisorHistory").innerHTML = "";
  toggleSupervisor2();
  loadCrewDropdowns();
  $("#modalProject").classList.add("show");
});

async function editProject(id) {
  const { data } = await sb.from("projetos").select("*").eq("id", id).single();
  if (!data) return;
  $("#modalProjectTitle").textContent = "Editar Projeto";
  $("#editProjectId").value = data.id;
  $("#modalCliente").value = data.cliente; $("#modalLocalidade").value = data.localidade;
  $("#modalSonda").value = data.sonda; $("#modalDataInício").value = data.data_inicio;
  $("#modalTurno").value = data.turno;
  $("#modalTurnosPorDia").value = data.turnos_por_dia || 1;
  toggleSupervisor2();

  // Supervisor free-text fields
  $("#modalSupervisor1").value = data.supervisor_turno1 || "";
  $("#modalSupervisor2").value = data.supervisor_turno2 || "";
  // Supervisor history display
  const sup1 = data.supervisor_turno1 || "";
  const sup2 = data.supervisor_turno2 || "";
  $("#supervisorHistory").innerHTML = [
    sup1 ? "Turno 1: <strong>" + sup1 + "</strong>" : "",
    sup2 ? "Turno 2: <strong>" + sup2 + "</strong>" : "",
    (!sup1 && !sup2) ? "Nenhum supervisor definido." : ""
  ].filter(Boolean).join("<br>");

  // Load geologist dropdown and assignment state
  await loadCrewDropdowns();
  await loadAssignmentState(id);
  $("#modalProject").classList.add("show");
}

$("#btnModalCancel").addEventListener("click", () => $("#modalProject").classList.remove("show"));
$("#modalProject").addEventListener("click", e => { if (e.target === $("#modalProject")) $("#modalProject").classList.remove("show"); });

$("#btnModalSave").addEventListener("click", async () => {
  const id = $("#editProjectId").value;
  const turnosPorDia = parseInt($("#modalTurnosPorDia").value) || 1;
  const payload = {
    cliente: $("#modalCliente").value.trim(),
    localidade: $("#modalLocalidade").value.trim(),
    sonda: $("#modalSonda").value.trim(),
    data_inicio: $("#modalDataInício").value,
    turno: $("#modalTurno").value.trim() || "07h x 17h",
    turnos_por_dia: turnosPorDia,
    supervisor_turno1: $("#modalSupervisor1").value.trim() || null,
    supervisor_turno2: $("#modalSupervisor2").value.trim() || null,
  };
  if (!payload.cliente || !payload.localidade || !payload.sonda || !payload.data_inicio) {
    toast("Preencha todos os campos obrigatórios.", "error"); return;
  }
  let error, projetoId = id;
  if (id) {
    ({ error } = await sb.from("projetos").update(payload).eq("id", id));
  } else {
    const { data: novo, error: insertErr } = await sb.from("projetos").insert(payload).select("id").single();
    if (insertErr) { toast("Erro: " + insertErr.message, "error"); return; }
    projetoId = novo.id;
  }
  if (error) { toast("Erro: " + error.message, "error"); return; }

  // Save geologist assignment
  await saveAssignment("geologo", projetoId);

  toast(id ? "Projeto atualizado!" : "Projeto criado!", "success");
  $("#modalProject").classList.remove("show");
  loadProjetos();
  loadRDOFilters();
});

let deleteTarget = null;
function confirmDeleteProject(id, name) {
  deleteTarget = { type: "project", id, name };
  $("#confirmTitle").textContent = "Excluir projeto?";
  $("#confirmMsg").textContent = `Tem certeza que deseja excluir "${name}"? Todos os RDOs deste projeto serão excluídos.`;
  $("#modalConfirm").classList.add("show");
}

// ============================================================
// CREW ASSIGNMENT HELPERS
// ============================================================
function toggleSupervisor2() {
  const sg = $("#supervisor2Group");
  sg.style.display = $("#modalTurnosPorDia").value === "2" ? "block" : "none";
}

async function loadCrewDropdowns() {
  // Load users with role 'supervisor' (geologist + field supervisors share this pool)
  const { data: supervisors } = await sb.from("profiles")
    .select("user_id,name,role")
    .in("role", ["supervisor", "admin"])
    .order("name");
  const opts = (supervisors || []).map(p =>
    `<option value="${p.user_id}">${p.name}${p.role === 'admin' ? ' (admin)' : ''}</option>`
  ).join("");
  const geologoOpts = '<option value="">Selecionar geólogo...</option>' + opts;
  const supOpts = '<option value="">Selecionar supervisor...</option>' + opts;
  $("#modalGeologo").innerHTML = geologoOpts;
  $("#modalSupervisor1").innerHTML = supOpts;
  $("#modalSupervisor2").innerHTML = supOpts;
}

async function loadAssignmentState(projetoId) {
  // Current geologist
  const { data: geoCur } = await sb.from("projeto_geologos")
    .select("user_id, inicio, profiles(name)")
    .eq("projeto_id", projetoId).is("fim", null).maybeSingle();
  if (geoCur) {
    $("#modalGeologo").value = geoCur.user_id;
    $("#geologoHistory").innerHTML = "Atual: <strong>" + geoCur.profiles.name + "</strong> (desde " + geoCur.inicio + ")";
  } else {
    $("#modalGeologo").value = "";
    $("#geologoHistory").innerHTML = "";
  }

  // Geologist history (past assignments)
  const { data: geoHist } = await sb.from("projeto_geologos")
    .select("user_id, inicio, fim, profiles(name)")
    .eq("projeto_id", projetoId).not("fim", "is", null)
    .order("inicio", { ascending: false }).limit(5);
  if (geoHist && geoHist.length > 0) {
    const hist = geoHist.map(function(g) { return g.profiles.name + " (" + g.inicio + " ate " + g.fim + ")"; }).join("<br>");
    $("#geologoHistory").innerHTML += "<br><span style=\"color:#9ca3af;\">Historico:</span><br>" + hist;
  }
}

async function saveAssignment(type, projetoId, turno) {
  const today = new Date().toISOString().split("T")[0];
  let newUserId, table, currentQuery;

  if (type === "geologo") {
    newUserId = $("#modalGeologo").value || null;
    table = "projeto_geologos";
    currentQuery = sb.from("projeto_geologos").select("id").eq("projeto_id", projetoId).is("fim", null);
  } else {
    newUserId = (turno === 1 ? $("#modalSupervisor1").value : $("#modalSupervisor2").value) || null;
    table = "projeto_supervisores";
    currentQuery = sb.from("projeto_supervisores").select("id").eq("projeto_id", projetoId).eq("turno", turno).is("fim", null);
  }

  // Fetch current assignment
  const { data: cur } = await currentQuery.maybeSingle();

  // If nothing changed, skip
  if (!cur && !newUserId) return;
  if (cur) {
    // Check if it's the same user
    const { data: curRow } = await sb.from(table).select("user_id").eq("id", cur.id).single();
    if (curRow && curRow.user_id === newUserId) return;
    // Close current assignment
    await sb.from(table).update({ fim: today }).eq("id", cur.id);
  }

  // Create new assignment if a user was selected
  if (newUserId) {
    const row = { projeto_id: projetoId, user_id: newUserId, inicio: today };
    if (turno) row.turno = turno;
    await sb.from(table).insert(row);
  }
}

async function loadRDOs() {
  const tbody = $("#rdosTable");
  tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:1rem;color:#9ca3af;">Carregando...</td></tr>';
  try {
  const projetoId = $("#filtroProjeto").value;
  const de = $("#filtroDe").value;
  const ate = $("#filtroAté").value;
  const status = $("#filtroStatus").value;

  let query = sb.from("rdos").select("id,data,tipo_dia,profundidade_inicial,profundidade_final,status,reopen_requested,projeto_id,version,projetos(cliente,sonda)").eq("deleted", false).order("data", { ascending: false }).limit(200);
  if (!$("#filtroAllVersions").checked) query = query.eq("latest", true);
  if (projetoId) query = query.eq("projeto_id", projetoId);
  if (de) query = query.gte("data", de);
  if (ate) query = query.lte("data", ate);
  if (status) query = query.eq("status", status);

  const { data, error } = await query;
  if (error || !data) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:1rem;color:#9ca3af;">Erro ao carregar.</td></tr>';
    return;
  }
  $("#rdosCount").textContent = data.length;
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:1rem;color:#9ca3af;">Nenhum RDO encontrado.</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(r => {
    const proj = r.projetos || {};
    return `
    <tr>
      <td>${r.data}${r.version > 1 ? ` <span style="font-size:.65rem;color:#a04000;">v${r.version}</span>` : ''}${r.reopen_requested ? ` <span style="font-size:.65rem;color:#f59e0b;">⟳</span>` : ''}</td><td>${proj.cliente || '-'} (${proj.sonda || '-'})</td><td>${r.tipo_dia || '-'}</td>
      <td>${r.profundidade_final != null ? (r.profundidade_inicial||0) + ' → ' + r.profundidade_final : '-'}</td>
      <td><span class="badge badge-${r.status}">${{rascunho:"Rascunho",em_revisao:"Em Revisão",aprovado:"Aprovado"}[r.status]||r.status}</span></td>
      <td class="actions">
        <button class="btn btn-secondary btn-sm" onclick="editRDO('${r.id}')">Editar</button>
        <button class="btn btn-secondary btn-sm" onclick="viewRDO('${r.id}')">Ver</button>
        ${r.status !== "rascunho" ? `<button class="btn btn-secondary btn-sm" onclick="generatePDF('${r.id}')">PDF</button>` : ""}
        ${currentProfile && currentProfile.role === "admin" ? `<button class="btn btn-danger btn-sm" onclick="confirmDeleteRDO('${r.id}','${r.data}')">Excluir</button>` : ""}
      </td>
    </tr>`;
  }).join("");
  } catch (e) {
    console.error("loadRDOs error:", e);
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:1rem;color:#ef4444;">Erro ao carregar RDOs: ' + e.message + '</td></tr>';
  }
}

// ============================================================
// EDIT RDO (versioned — marks old as latest=false, creates copy)
// ============================================================
async function editRDO(id) {
  if (!confirm("Isso criará uma nova versão editável do RDO. A versão original será preservada. Continuar?")) return;
  const { data: original } = await sb.from("rdos").select("*").eq("id", id).single();
  if (!original) { toast("RDO não encontrado.", "error"); return; }
  // Mark original as not latest
  await sb.from("rdos").update({ latest: false }).eq("id", id);
  // Creaté copy with version+1, status=rascunho, edited tracking
  const copy = { ...original };
  delete copy.id; delete copy.created_at;
  copy.version = (original.version || 1) + 1;
  copy.latest = true;
  copy.status = "rascunho";
  copy.edited_by = currentUser?.id || null;
  copy.edited_at = new Date().toISOString();
  const { data: newRDO, error } = await sb.from("rdos").insert(copy).select().single();
  if (error) { toast("Erro ao criar cópia: " + error.message, "error"); return; }
  toast(`Nova versão (v${copy.version}) criada. Redirecionando para o formulário...`, "success");
  // Open in field app for editing
  window.open(`index.html?edit=${newRDO.id}`, "_blank");
  loadRDOs();
}

// PDF GENERATION (jsPDF + autotable)
const { jsPDF } = window.jspdf;
const PDF_LOGO = "logo_DH.png";

async function generatePDF(id) {
  const { data: r } = await sb.from("rdos").select("*,projetos(cliente,sonda,localidade,data_inicio,turno)").eq("id", id).single();
  if (!r) { toast("RDO não encontrado.", "error"); return; }

  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const W = 210, M = 15;
  let y = 10;

  try { doc.addImage(PDF_LOGO, "PNG", W - M - 35, y, 35, 17.5); } catch(_) {}
  y += 2;
  doc.setFontSize(11); doc.setTextColor(160, 64, 0);
  doc.text("BOLETIM DIARIO DE OBRAS", W / 2, y + 5, { align: "center" });
  y += 10; doc.setDrawColor(192, 160, 160); doc.line(M, y, W - M, y);

  y += 6; doc.setFontSize(9); doc.setTextColor(0);
  const proj = r.projetos || {};
  const info = [
    ["Cliente:", proj.cliente || "-", "Data:", r.data || "-"],
    ["Sonda:", proj.sonda || "-", "Turno:", proj.turno || "-"],
    ["Localidade:", proj.localidade || "-"],
  ];
  doc.autoTable({ startY: y, body: info, theme: "plain", styles: { fontSize: 8, cellPadding: 2 },
    columnStyles: { 0: { fontStyle: "bold", cellWidth: 25 }, 1: { cellWidth: 55 }, 2: { fontStyle: "bold", cellWidth: 18 }, 3: { cellWidth: 55 } },
    margin: { left: M } });
  y = doc.lastAutoTable.finalY + 2;
  doc.setDrawColor(192, 160, 160); doc.line(M, y, W - M, y);

  y += 5;
  if (r.profundidade_final != null) {
    doc.setFontSize(9); doc.setFont(undefined, "bold");
    doc.text("Perfuração:", M, y); doc.setFont(undefined, "normal");
    doc.text(`${r.profundidade_inicial || 0} a ${r.profundidade_final} m`, M + 30, y);
    y += 5;
  }
  // Stratigraphy (array)
  const stratEntries = r.estratigrafia_mudancas || (r.estratigrafia_descricao ? [{ profundidade: r.estratigrafia_profundidade, descricao: r.estratigrafia_descricao }] : []);
  if (stratEntries.length > 0) {
    doc.setFont(undefined, "bold"); doc.text("Estratigrafia:", M, y); y += 4;
    doc.setFont(undefined, "normal");
    stratEntries.forEach(s => {
      doc.text(`${s.descricao || "-"} (${s.profundidade || "?"} m)`, M + 5, y);
      y += 4;
    });
  }

  // Striplog summary
  if (r.striplog && r.striplog.length > 0) {
    const depths = r.striplog.map(s => s.profundidade).filter(d => !isNaN(d));
    if (depths.length > 0) {
      const firstD = depths[0], lastD = depths[depths.length - 1];
      const firstT = r.striplog[0].inicio || r.striplog[0].horario || "";
      const meters = lastD - firstD;
      if (meters > 0 && firstT) {
        y += 2; doc.setFontSize(9); doc.setFont(undefined, "bold");
        doc.text("Striplog:", M, y); doc.setFont(undefined, "normal");
        doc.text(`${meters.toFixed(1)} m perfurados | Início: ${firstT}`, M + 25, y);
        y += 5;
      }
    }
  }

  if (r.operacoes && r.operacoes.length > 0) {
    y += 2;
    doc.setFontSize(9); doc.setFont(undefined, "bold"); doc.text("Registro de Atividades:", M, y); y += 4;
    const ops = r.operacoes.map(o => [o.inicio + "-" + o.termino, o.descritivo || ""]);
    doc.autoTable({ startY: y, head: [["Horario", "Descritivo"]], body: ops, theme: "grid",
      styles: { fontSize: 7, cellPadding: 2 }, headStyles: { fillColor: [245, 240, 235], textColor: [0] },
      columnStyles: { 0: { cellWidth: 30 } }, margin: { left: M } });
    y = doc.lastAutoTable.finalY + 3;
  }

  y += 2; doc.setFontSize(9); doc.setFont(undefined, "bold"); doc.text("HSE:", M, y); y += 4;
  doc.setFont(undefined, "normal");
  doc.text(`DDS: ${r.hse_dds ? "Sim" : "Não"}  |  EPIs: ${r.hse_epis_vistoriados ? "Sim" : "Não"}  |  HH Expostas: ${r.hse_hh_expostas || "-"}`, M, y);
  y += 5;
  if (r.hse_incidentes) { doc.text(`Incidentes: ${r.hse_incidentes}`, M, y); y += 4; }

  if (r.observacoes) {
    y += 2; doc.setFont(undefined, "bold"); doc.text("Observações:", M, y); y += 4;
    doc.setFont(undefined, "normal"); doc.setFontSize(8);
    doc.text(r.observacoes, M, y, { maxWidth: W - 2 * M });
  }

  y += 10; doc.setFontSize(9);
  doc.text(`Supervisor: ${r.aprovacao_geólogo || "-"}`, M, y);

  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(7); doc.setTextColor(156, 163, 175);
    doc.text(`RDO Auto | Pagina ${i}`, W / 2, 290, { align: "center" });
  }

  const filename = `RDO_${proj.cliente || "projeto"}_${r.data}.pdf`.replace(/\s+/g, "_");
  doc.save(filename);
  toast("PDF exportado!", "success");
}

function confirmDeleteRDO(id, data) {
  deleteTarget = { type: "rdo", id, data };
  $("#confirmTitle").textContent = "Excluir RDO?";
  $("#confirmMsg").textContent = `Tem certeza que deseja excluir o RDO de ${data}?`;
  $("#modalConfirm").classList.add("show");
}

$("#btnConfirmCancel").addEventListener("click", () => { deleteTarget = null; $("#modalConfirm").classList.remove("show"); });
$("#modalConfirm").addEventListener("click", e => { if (e.target === $("#modalConfirm")) { deleteTarget = null; $("#modalConfirm").classList.remove("show"); } });

$("#btnConfirmOk").addEventListener("click", async () => {
  if (!deleteTarget) return;
  let error;
  if (deleteTarget.type === "project") {
    ({ error } = await sb.from("projetos").delete().eq("id", deleteTarget.id));
  } else {
    ({ error } = await sb.from("rdos").update({ deleted: true }).eq("id", deleteTarget.id));
  }
  if (error) { toast("Erro: " + error.message, "error"); }
  else { toast(deleteTarget.type === "project" ? "Projeto excluído!" : "RDO excluído!", "success"); }
  deleteTarget = null;
  $("#modalConfirm").classList.remove("show");
  if (deleteTarget?.type === "project") { loadProjetos(); loadRDOFilters(); }
  else loadRDOs();
});

// CSV EXPORT

$("#btnExportCSV").addEventListener("click", async () => {
  const projetoId = $("#filtroProjeto").value;
  const de = $("#filtroDe").value;
  const ate = $("#filtroAté").value;
  const status = $("#filtroStatus").value;
  let query = sb.from("rdos").select("data,tipo_dia,profundidade_inicial,profundidade_final,estratigrafia_descricao,status,observacoes,condicoes_climaticas,chuva,hse_dds,hse_hh_expostas,projetos(cliente,sonda)").order("data").limit(500);
  if (projetoId) query = query.eq("projeto_id", projetoId);
  if (de) query = query.gte("data", de);
  if (ate) query = query.lte("data", ate);
  if (status) query = query.eq("status", status);
  const { data } = await query;
  if (!data || data.length === 0) { toast("Nenhum dado para exportar.", "error"); return; }
  const headers = ["data","tipo","cliente","sonda","prof_inicial","prof_final","estratigrafia","hse_dds","hh_expostas","cond_clima","choveu","status","observacoes"];
  const rows = data.map(r => [
    r.data, r.tipo_dia, r.projetos?.cliente||"", r.projetos?.sonda||"",
    r.profundidade_inicial||"", r.profundidade_final||"", r.estratigrafia_descricao||"",
    r.hse_dds?"Sim":"Não", r.hse_hh_expostas||"", r.condicoes_climaticas||"",
    r.chuva?"Sim":"Não", r.status, (r.observacoes||"").replace(/"/g,'""')
  ]);
  const csv = [headers.join(","), ...rows.map(r => '"' + r.join('","') + '"')].join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "rdos_export_" + new Date().toISOString().split("T")[0] + ".csv";
  a.click();
  toast("CSV exportado!", "success");
});

async function loadUsuários() {
  const { data: profiles } = await sb.from("profiles").select("user_id,name,email,role,phone").order("name");
  const tbody = $("#usuariosTable");
  if (!profiles || profiles.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:1rem;color:#9ca3af;">Nenhum usuario.</td></tr>';
    return;
  }
  tbody.innerHTML = profiles.map(p => `
    <tr>
      <td>${p.name || '-'}</td><td>${p.email || '-'}</td><td>${p.phone || '-'}</td><td>${p.role}</td>
      <td class="actions">
        <button class="btn btn-secondary btn-sm" onclick="editUser('${p.user_id}')">Editar</button>
        <button class="btn btn-secondary btn-sm" onclick="copyOnboarding('${p.user_id}')">📋 Onboard</button>
      </td>
    </tr>`).join("");
}

async function copyOnboarding(userId) {
  const { data } = await sb.from("profiles").select("name,email").eq("user_id", userId).maybeSingle();
  if (!data) { toast("Usuário não encontrado.", "error"); return; }
  const msg = `Aqui está seu acesso ao RDO Auto!\n\n` +
    `Login: ${data.email}\n` +
    `Senha: a definida pelo administrador\n\n` +
    `Ative as notificações no Telegram:\n` +
    `https://t.me/rdoauto_bot?start=${userId}\n\n` +
    `Basta clicar no link acima e enviar /start para receber notificações dos seus RDOs.`;
  await navigator.clipboard.writeText(msg);
  toast("Mensagem de onboarding copiada!", "success");
}

$("#btnNewUser").addEventListener("click", () => {
  $("#modalUserTitle").textContent = "Novo Usuário";
  $("#editUserId").value = "";
   $("#modalUserName").value = ""; $("#modalUserEmail").value = ""; $("#modalUserPhone").value = "";
  $("#modalUserPassword").value = ""; $("#modalUserPassword2").value = ""; $("#modalUserRole").value = "colaborador";
  $("#modalUser").classList.add("show");
});

async function editUser(userId) {
  const { data } = await sb.from("profiles").select("*").eq("user_id", userId).single();
  if (!data) return;
  $("#modalUserTitle").textContent = "Editar Usuário";
  $("#editUserId").value = data.user_id;
   $("#modalUserName").value = data.name || "";
   $("#modalUserEmail").value = data.email || "";
   $("#modalUserPhone").value = data.phone || "";
  $("#modalUserPassword").value = ""; $("#modalUserPassword2").value = "";
  $("#modalUserRole").value = data.role;
  $("#modalUser").classList.add("show");
}

$("#btnUserModalCancel").addEventListener("click", () => $("#modalUser").classList.remove("show"));
$("#modalUser").addEventListener("click", e => { if (e.target === $("#modalUser")) $("#modalUser").classList.remove("show"); });

$("#btnUserModalSave").addEventListener("click", async () => {
  const id = $("#editUserId").value;
  const name = $("#modalUserName").value.trim();
  const email = $("#modalUserEmail").value.trim();
  const phone = $("#modalUserPhone").value.trim().replace(/\D/g, "");
  const password = $("#modalUserPassword").value;
  const role = $("#modalUserRole").value;

  if (!name || !email || !role) { toast("Preencha nome, e-mail e função.", "error"); return; }
  if (!id && !password) { toast("Senha obrigatória para novo usuário.", "error"); return; }
  if (password) {
    const p2 = $("#modalUserPassword2").value;
    if (password !== p2) { toast("Senhas não conferem.", "error"); return; }
    if (password.length < 8) { toast("Senha deve ter no mínimo 8 caracteres.", "error"); return; }
  }

  if (!id) {
    const { data: authData, error: authErr } = await sb.auth.signUp({ email, password });
    if (authErr) { toast("Erro ao criar usuário: " + authErr.message, "error"); return; }
    if (!authData?.user) { toast("Erro ao criar usuário.", "error"); return; }
    await sb.from("profiles").upsert({ user_id: authData.user.id, name, email, phone, role });
    // Auto-copy onboarding message with the password
    const onboardMsg = `Aqui está seu acesso ao RDO Auto!\n\n` +
      `Login: ${email}\n` +
      `Senha: ${password}\n\n` +
      `Ative as notificações no Telegram:\n` +
      `https://t.me/rdoauto_bot?start=${authData.user.id}\n\n` +
      `Basta clicar no link acima e enviar /start para receber notificações dos seus RDOs.`;
    await navigator.clipboard.writeText(onboardMsg);
    toast("Mensagem de onboarding copiada! Envie para o usuário.", "success");
  } else {
    await sb.from("profiles").update({ name, email, phone, role }).eq("user_id", id);
    if (password) {
      // Show SQL snippet for password reset
      const sql = `UPDATE auth.users SET encrypted_password = crypt('${password}', gen_salt('bf')) WHERE email = '${email}';`;
      await navigator.clipboard.writeText(sql);
      toast("SQL copiado! Execute no SQL Editor do Supabase para alterar a senha.", "success");
    }
  }
  toast(id ? "Perfil atualizado!" : "Usuário criado!", "success");
  $("#modalUser").classList.remove("show");
  loadUsuários();
});
